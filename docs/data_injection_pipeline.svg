<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-cam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="grad-l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="grad-l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="grad-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
    </marker>

    <!-- Filter for subtle drop shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Solid Dark Background -->
  <rect width="100%" height="100%" fill="#0b0f19"/>

  <!-- Title Header -->
  <g transform="translate(50, 40)">
    <text x="450" y="0" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">Drone AI Camera Data Injection Pipeline</text>
    <text x="450" y="24" text-anchor="middle" fill="#94a3b8" font-size="13">Hierarchical Perception, Navigation &amp; Actuation Architecture</text>
  </g>

  <!-- Top Block: Hardware AI Camera -->
  <g transform="translate(260, 95)" filter="url(#shadow)">
    <rect width="480" height="95" rx="10" fill="url(#grad-cam)" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="30" y="35" text-anchor="middle" fill="#c084fc" font-size="14">📷</text>
    
    <text x="56" y="32" fill="#e9d5ff" font-size="15" font-weight="700">Raspberry Pi AI Camera (Sony IMX500)</text>
    <text x="56" y="52" fill="#a855f7" font-size="11" font-weight="600">ON-SENSOR NEURAL ACCELERATOR (30 FPS)</text>
    <text x="240" y="76" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="ui-monospace, monospace">Outputs: [class_id, confidence, x_min, y_min, x_max, y_max]</text>
  </g>

  <!-- Routing Lines from Camera to L3 & L2 -->
  <!-- Left path to L3 -->
  <path d="M 380,190 L 380,240 L 250,240 L 250,265" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
  <!-- Right path to L2 -->
  <path d="M 620,190 L 620,240 L 750,240 L 750,265" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>

  <!-- Sub-labels on Camera Split -->
  <rect x="155" y="228" width="170" height="22" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="240" y="243" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">Semantic Presence (1 Hz)</text>

  <rect x="665" y="228" width="170" height="22" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="750" y="243" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">Spatial Errors (20-30 Hz)</text>

  <!-- Level 3: Strategic Layer (Left Column) -->
  <g transform="translate(60, 275)" filter="url(#shadow)">
    <rect width="380" height="210" rx="10" fill="url(#grad-l3)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="30" fill="#fbbf24" font-size="15" font-weight="700">Level 3: Strategic Supervisor</text>
    <text x="20" y="48" fill="#d97706" font-size="11" font-weight="600">MISSION STATE MACHINE (1 – 2 Hz)</text>

    <!-- Content Box -->
    <rect x="15" y="62" width="350" height="72" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="25" y="82" fill="#94a3b8" font-size="11" font-weight="600">Ingests Semantic State:</text>
    <text x="25" y="100" fill="#f8fafc" font-size="11" font-family="ui-monospace, monospace">• target_detected: True / False</text>
    <text x="25" y="118" fill="#f8fafc" font-size="11" font-family="ui-monospace, monospace">• target_confidence: 0.0 – 1.0 | time_lost</text>

    <text x="20" y="155" fill="#e2e8f0" font-size="12" font-weight="600">Decides High-Level Goal:</text>
    <text x="20" y="174" fill="#fbbf24" font-size="12" font-family="ui-monospace, monospace">SEARCH_OBJECT ➔ TRACK ➔ RTH ➔ LAND</text>
    <text x="20" y="194" fill="#94a3b8" font-size="11">Enforces deterministic 75s/95s battery safety.</text>
  </g>

  <!-- Level 2: Tactical Layer (Right Column) -->
  <g transform="translate(560, 275)" filter="url(#shadow)">
    <rect width="380" height="210" rx="10" fill="url(#grad-l2)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="20" y="30" fill="#38bdf8" font-size="15" font-weight="700">Level 2: Tactical Policy</text>
    <text x="20" y="48" fill="#0284c7" font-size="11" font-weight="600">NEURAL NETWORK (TFLite @ 20 – 30 Hz)</text>

    <!-- Content Box -->
    <rect x="15" y="62" width="350" height="72" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="25" y="82" fill="#94a3b8" font-size="11" font-weight="600">Ingests Normalized Geometric Vector:</text>
    <text x="25" y="100" fill="#f8fafc" font-size="11" font-family="ui-monospace, monospace">• err_x: [-1.0, 1.0] (Horiz Centering)</text>
    <text x="25" y="118" fill="#f8fafc" font-size="11" font-family="ui-monospace, monospace">• err_y: [-1.0, 1.0] | box_area: [0, 1]</text>

    <text x="20" y="155" fill="#e2e8f0" font-size="12" font-weight="600">Outputs 4D Kinematic Action:</text>
    <text x="20" y="174" fill="#38bdf8" font-size="12" font-family="ui-monospace, monospace">[desired_alt, desired_roll, pitch, yaw]</text>
    <text x="20" y="194" fill="#94a3b8" font-size="11">Fuses Camera Errors with Optical Flow (vx, vy).</text>
  </g>

  <!-- Level 3 to Level 2 Connection (Goal Conditioning) -->
  <path d="M 440,380 L 550,380" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="450" y="358" width="90" height="20" rx="4" fill="#451a03" stroke="#b45309" stroke-width="1"/>
  <text x="495" y="372" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="600">Goal Mode</text>

  <!-- Level 2 to Level 1 Connection -->
  <path d="M 750,485 L 750,525 L 510,525 L 510,545" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="545" y="515" width="170" height="20" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
  <text x="630" y="529" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="600">Kinematic Action [-1, 1]</text>

  <!-- Level 1: Low-Level Flight Controller (Bottom Block) -->
  <g transform="translate(180, 555)" filter="url(#shadow)">
    <rect width="640" height="125" rx="10" fill="url(#grad-l1)" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="28" fill="#34d399" font-size="15" font-weight="700">Level 1: Execution Layer (FlightController &amp; Betaflight)</text>
    <text x="25" y="46" fill="#059669" font-size="11" font-weight="600">CLOSED-LOOP ACTUATION &amp; SAG TRIM (100 Hz)</text>

    <rect x="20" y="56" width="600" height="55" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="35" y="76" fill="#ef4444" font-size="11" font-weight="700">⚠️ ZERO CAMERA DATA INGESTED (Strictly Decoupled)</text>
    <text x="35" y="96" fill="#94a3b8" font-size="11">Translates Kinematic Actions to <tspan fill="#34d399" font-weight="600">RC PWM [1505, 1685]</tspan>, applies slew limits (0.25 m/s) and adaptive hover trim.</text>
  </g>
</svg>
